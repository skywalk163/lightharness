[pytest]
# lightharness 全量回归门禁配置
# 解决：workbuddy/小浣熊全量跑不完——真实服务器类example hang住无超时 + 串行403个example太慢
# 措施：
#   1. --timeout=60：每个测试60秒硬超时，hang住的（web服务器等待/网络IO阻塞）被kill，不再永远等
#   2. -n 4：xdist 并行跑（固定 4 worker）。
#      ⚠️ 用 -n auto 在 10 核机上会起 10 worker，踩中 Windows「-n 8+ 挂死/死锁」坑
#      （lightharness 全量 tests/unit 跑 6 分钟无任何输出即此因）。固定 -n 4 稳定跑通。
# 注意：web服务器类example用内核随机端口（R42/R43已验证），并行无端口冲突
addopts = --timeout=60 -n 4
