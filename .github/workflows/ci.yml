name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.13"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 前置：确认测试对 light 编译器与 lightplugin 的依赖是硬依赖
        run: |
          echo "本仓测试依赖同级目录的 light（语言本体编译器）与 lightplugin（生产挂载插件生态）。"
          echo "任一仓克隆失败/不可用 → 整批用例无意义 → 必须红，不得 skip。"

      - name: 检出 lightharness
        uses: actions/checkout@v4

      - name: 检出 light 编译器（语言本体）
        run: |
          REPO="${{ vars.LIGHT_MERGE_REPO }}"
          if [ -z "$REPO" ]; then
            echo "::notice::LIGHT_MERGE_REPO 未配置，使用默认地址"
            REPO="https://gitcode.com/skywalk163/light.git"
          fi
          if ! git clone --depth 1 "$REPO" ../light; then
            echo "::error title=light 编译器检出失败::无法克隆 $REPO。lightharness 的测试依赖同级目录的 light 仓，缺它整批用例没有意义。请检查网络/仓库地址/vars.LIGHT_MERGE_REPO。"
            exit 1
          fi

      - name: 检出 lightplugin（生产挂载插件生态）
        run: |
          REPO="${{ vars.LIGHTPLUGIN_REPO }}"
          if [ -z "$REPO" ]; then
            echo "::notice::LIGHTPLUGIN_REPO 未配置，使用默认地址"
            REPO="https://gitcode.com/skywalk163/lightplugin.git"
          fi
          if ! git clone --depth 1 "$REPO" ../lightplugin; then
            echo "::error title=lightplugin 检出失败::无法克隆 $REPO。src/总入口.light 的 从 生产挂载 导入 挂载全部插件 是硬依赖，缺它 test_r111_e2e / probe_r3_挂载对账 等用例必红。"
            exit 1
          fi
          # 标志物校验：仅 clone 成功不够，必须含 集成/生产挂载.light
          if [ ! -f ../lightplugin/集成/生产挂载.light ]; then
            echo "::error title=lightplugin 内容不完整::../lightplugin 缺少 集成/生产挂载.light，请检查 LIGHTPLUGIN_REPO 指向的分支/仓库。"
            exit 1
          fi

      - name: 设置 Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 校验 pytest 插件能力（pytest.ini 的 addopts 硬依赖）
        run: |
          set -e
          python -m pytest --help | grep -q -- '--timeout=' || {
            echo "::error::pytest-timeout 未安装：pytest.ini 的 --timeout=60 无法识别"
            exit 1
          }
          python -m pytest --help | grep -qE '^  -n ' || {
            echo "::error::pytest-xdist 未安装：pytest.ini 的 -n 4 无法识别"
            exit 1
          }

      - name: 校验 light 编译器可用（能力探针，替代硬编码 commit）
        run: |
          set -e
          cd ../light
          # 光明确认能跑起来
          python -m cli.light_unified --version
          # 能编一个最小程序（这是所有 .light 用例的前置能力）
          cat > /tmp/_lh_hello.light <<'LIGHT'
          打印("hello")
          LIGHT
          python -m cli.light_unified run /tmp/_lh_hello.light

      - name: 运行 CI 测试
        env:
          LIGHT_MERGE: ${{ github.workspace }}/../light
          LIGHTPLUGIN: ${{ github.workspace }}/../lightplugin
        run: python scripts/ci_test.py

      - name: 上传失败日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-logs
          path: |
            tests/
            examples/
          retention-days: 7
