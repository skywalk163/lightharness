name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.13"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 前置：确认测试对 light 编译器的依赖是硬依赖
        run: |
          echo "本仓测试依赖 ../light-merge（语言本体编译器）。"
          echo "克隆失败/编译器不可用 → 整批用例无意义 → 必须红，不得 skip。"

      - name: 检出 lightharness
        uses: actions/checkout@v4

      - name: 检出 light 编译器（语言本体）
        run: |
          REPO="${{ vars.LIGHT_MERGE_REPO }}"
          if [ -z "$REPO" ]; then
            echo "::notice::LIGHT_MERGE_REPO 未配置，使用默认地址"
            REPO="https://gitcode.com/skywalk163/light.git"
          fi
          if ! git clone --depth 1 "$REPO" ../light-merge; then
            echo "::error title=light 编译器检出失败::无法克隆 $REPO。lightharness 的测试依赖同级目录的 light 仓，缺它整批用例没有意义。请检查网络/仓库地址/vars.LIGHT_MERGE_REPO。"
            exit 1
          fi

      - name: 设置 Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 校验 light 编译器可用（能力探针，替代硬编码 commit）
        run: |
          set -e
          cd ../light-merge
          # 光明确认能跑起来
          python -m cli.light_unified --version
          # 能编一个最小程序（这是所有 .light 用例的前置能力）
          cat > /tmp/_lh_hello.light <<'LIGHT'
          打印("hello")
          LIGHT
          python -m cli.light_unified run /tmp/_lh_hello.light

      - name: 运行 CI 测试
        env:
          LIGHT_MERGE: ${{ github.workspace }}/../light-merge
        run: python scripts/ci_test.py

      - name: 上传失败日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-logs
          path: |
            tests/
            examples/
          retention-days: 7
