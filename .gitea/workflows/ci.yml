name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.13"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出 lightharness
        uses: actions/checkout@v4

      - name: 检出 light-merge 编译器（内网 Gitea）
        run: |
          REPO="${{ vars.LIGHT_MERGE_REPO }}"
          if [ -z "$REPO" ]; then
            REPO="http://192.168.1.5:3000/skywalk/light.git"
          fi
          git clone --depth 1 "$REPO" ../light-merge

      - name: 设置 Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行 CI 测试
        env:
          LIGHT_MERGE: ${{ github.workspace }}/../light-merge
        run: python scripts/ci_test.py
